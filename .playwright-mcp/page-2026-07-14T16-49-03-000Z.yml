      - heading "Maxfiylik siyosati" [level=1] [ref=f24e13]
      - paragraph [ref=f24e14]: "Oxirgi yangilanish: 2026-07-14"
      - generic [ref=f24e15]:
        - paragraph [ref=f24e16]: Ushbu Maxfiylik siyosati Metrix ("biz") sizning shaxsiy ma'lumotlaringizni qanday yig'ishi, ishlatishi va himoya qilishini tushuntiradi. Xizmatdan foydalanish orqali siz quyidagi amaliyotlarga rozilik bildirasiz.
        - generic [ref=f24e17]:
          - heading "1. Qanday ma'lumot yig'amiz" [level=2] [ref=f24e18]
          - list [ref=f24e20]:
            - listitem [ref=f24e21]: Hisob ma'lumotlari— email, ism, parol (bcrypt bilan xeshlangan holda saqlanadi), yoki OAuth provayderdan (Google, GitHub, Discord, Facebook, Apple) kelgan profil ma'lumotlari.
            - listitem [ref=f24e22]: Sayt analitikasi— sahifa ko'rishlar, sessiya davomiyligi, qurilma/brauzer turi, taxminiy davlat (IP orqali, IP manzilning o'zi taxminiy geolokatsiyadan keyin uzoq muddat saqlanmaydi), referrer va UTM parametrlari — bularning barchasi siz o'rnatgan track.js skripti orqali yig'iladi.
            - listitem [ref=f24e23]: Ijtimoiy tarmoq statistikasi— OAuth orqali ulagan hisoblaringizning ochiq ko'rsatkichlari (obunachilar, ko'rishlar, layklar va h.k.).
            - listitem [ref=f24e24]: Texnik ma'lumotlar — kirish tarixi (IP, brauzer, vaqt), xavfsizlik auditi maqsadida.
        - generic [ref=f24e25]:
          - heading "2. Ma'lumotlardan qanday foydalanamiz" [level=2] [ref=f24e26]
          - generic [ref=f24e27]:
            - list [ref=f24e28]:
              - listitem [ref=f24e29]: Sizga analitika boshqaruv panelini va hisobotlarni taqdim etish uchun;
              - listitem [ref=f24e30]: Haftalik AI-tahlil (agar yoqilgan bo'lsa) tayyorlash uchun;
              - listitem [ref=f24e31]: Hisobingiz xavfsizligini ta'minlash (login audit, shubhali faoliyatni aniqlash) uchun;
              - listitem [ref=f24e32]: Xizmatni yaxshilash va texnik muammolarni bartaraf etish uchun.
            - paragraph [ref=f24e33]: Ma'lumotlaringizni hech qachon reklama maqsadida sotmaymiz yoki uchinchi shaxslarga ijaraga bermaymiz.
        - generic [ref=f24e34]:
          - heading "3. Cookie va localStorage" [level=2] [ref=f24e35]
          - paragraph [ref=f24e37]: Kuzatuv skripti (track.js) tashrifchi brauzerida localStorage'da anonim sessiya identifikatorini saqlaydi (30 daqiqa harakatsizlikdan keyin yangilanadi) — bu identifikator shaxsni aniqlamaydi. Boshqaruv panelida esa sessiyangizni saqlash uchun faqat JavaScript o'qiy olmaydigan (httpOnly) cookie ishlatiladi.
        - generic [ref=f24e38]:
          - heading "4. Ma'lumotlarni saqlash va xavfsizlik" [level=2] [ref=f24e39]
          - list [ref=f24e41]:
            - listitem [ref=f24e42]: Parollar bcrypt bilan bir tomonlama xeshlanadi;
            - listitem [ref=f24e43]: Ijtimoiy tarmoq OAuth tokenlari AES-256-GCM bilan shifrlangan holda saqlanadi;
            - listitem [ref=f24e44]: API kalitlar xom holda saqlanmaydi — faqat ularning kriptografik xeshi;
            - listitem [ref=f24e45]: Sayt analitikasi ma'lumotlari tarif rejangizga bog'liq muddat davomida saqlanadi, so'ngra avtomatik o'chiriladi;
            - listitem [ref=f24e46]: Hisobni o'chirishda ma'lumotlar 6 oy davomida tiklash uchun saqlanadi, so'ngra butunlay va qaytarib bo'lmas tarzda o'chiriladi.
        - generic [ref=f24e47]:
          - heading "5. Uchinchi tomonlar bilan almashish" [level=2] [ref=f24e48]
          - paragraph [ref=f24e50]: "Ma'lumotlaringizni faqat quyidagi hollarda uchinchi tomonlarga uzatamiz: (a) siz OAuth orqali ulagan platformaning API'siga statistika so'rash uchun so'rov yuborilganda, (b) email yuborish xizmati (Resend) orqali sizga xabarnoma yuborilganda, yoki (c) qonuniy talab bo'lganda."
        - generic [ref=f24e51]:
          - heading "6. Sizning huquqlaringiz" [level=2] [ref=f24e52]
          - list [ref=f24e54]:
            - listitem [ref=f24e55]: Barcha ma'lumotlaringizni JSON formatida eksport qilish (Sozlamalar bo'limidan);
            - listitem [ref=f24e56]: Hisobingizni va unga tegishli barcha ma'lumotlarni o'chirish;
            - listitem [ref=f24e57]: Ijtimoiy tarmoq ulanishlarini istalgan vaqtda uzish;
            - listitem [ref=f24e58]: Haftalik AI-hisobotdan bosh tortish (Sozlamalar → Xavfsizlik).
        - generic [ref=f24e59]:
          - heading "7. Bolalar maxfiyligi" [level=2] [ref=f24e60]
          - paragraph [ref=f24e62]: Xizmat 13 yoshdan kichik shaxslar uchun mo'ljallanmagan va biz ongli ravishda ulardan ma'lumot yig'maymiz.
        - generic [ref=f24e63]:
          - heading "8. Ushbu siyosatga o'zgartirishlar" [level=2] [ref=f24e64]
          - paragraph [ref=f24e66]: Ushbu Maxfiylik siyosatini vaqti-vaqti bilan yangilashimiz mumkin. Muhim o'zgarishlar haqida email orqali xabar beramiz.
        - generic [ref=f24e67]:
          - heading "9. Bog'lanish" [level=2] [ref=f24e68]
          - paragraph [ref=f24e70]:
            - text: Ma'lumotlaringiz yuzasidan savol yoki so'rovlaringiz bo'lsa,
            - link "privacy@metrix.io" [ref=f24e71] [cursor=pointer]:
              - /url: mailto:privacy@metrix.io
            - text: manziliga yozing.
