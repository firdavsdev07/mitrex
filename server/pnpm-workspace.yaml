allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': true
  '@sentry/node-cpu-profiler': set this to true or false
  '@swc/core': true
  bcrypt: true
  bufferutil: false
  core-js: false
  es5-ext: false
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true
  utf-8-validate: false
onlyBuiltDependencies:
  - '@prisma/engines'
  - '@swc/core'
  - bcrypt
  - msgpackr-extract
  - prisma
  - unrs-resolver
